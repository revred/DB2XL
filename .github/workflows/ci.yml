name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  BUILD_CONFIGURATION: 'Release'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better coverage analysis
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore dependencies
      run: dotnet restore DB2XL.sln
    
    - name: Build solution
      run: dotnet build DB2XL.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore --verbosity minimal
    
    - name: Run unit tests with coverage
      run: |
        dotnet test DB2XL.sln \
          --configuration ${{ env.BUILD_CONFIGURATION }} \
          --no-build \
          --verbosity minimal \
          --logger trx \
          --logger "console;verbosity=minimal" \
          --collect:"XPlat Code Coverage" \
          --results-directory TestResults/ \
          --settings coverlet.runsettings \
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
          
    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool
      
    - name: Generate coverage report
      run: |
        reportgenerator \
          "-reports:TestResults/**/coverage.cobertura.xml" \
          "-targetdir:TestResults/CoverageReport" \
          "-reporttypes:Html;Cobertura;TextSummary" \
          "-verbosity:Warning"
          
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: TestResults/**/coverage.cobertura.xml
        fail_ci_if_error: false
        verbose: true
        token: ${{ secrets.CODECOV_TOKEN }}
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults/
        retention-days: 7
        
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: TestResults/CoverageReport/
        retention-days: 30

  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore DB2XL.sln
      
    - name: Run security analysis
      run: |
        dotnet list DB2XL.sln package --vulnerable --include-transitive 2>&1 | tee security-report.txt
        if grep -q "has the following vulnerable packages" security-report.txt; then
          echo "❌ Vulnerable packages detected!"
          cat security-report.txt
          exit 1
        else
          echo "✅ No vulnerable packages found"
        fi
        
    - name: Upload security report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-report
        path: security-report.txt
        retention-days: 30

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 45
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore and build
      run: |
        dotnet restore DB2XL.sln
        dotnet build DB2XL.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
        
    - name: Run performance benchmarks
      run: |
        dotnet test DB2XL.Query.Tests/DB2XL.Query.Tests.csproj \
          --configuration ${{ env.BUILD_CONFIGURATION }} \
          --no-build \
          --filter "FullyQualifiedName~FilteringBenchmark" \
          --logger "console;verbosity=detailed" \
          -- TestRunParameters.Parameter.name=MaxTestTimeoutInMilliseconds TestRunParameters.Parameter.value=600000
          
    - name: Upload performance results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-results
        path: TestResults/
        retention-days: 14

  integration-tests:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    needs: build-and-test
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore and build
      run: |
        dotnet restore DB2XL.sln
        dotnet build DB2XL.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
        
    - name: Run integration tests
      run: |
        dotnet test SqliteXport.Tests/SqliteXport.Tests.csproj \
          --configuration ${{ env.BUILD_CONFIGURATION }} \
          --no-build \
          --filter "Category=Integration" \
          --logger "console;verbosity=minimal"
          
    - name: Test console application
      shell: bash
      run: |
        # Build console app
        dotnet publish SqliteXport.Console/SqliteXport.Console.csproj \
          --configuration ${{ env.BUILD_CONFIGURATION }} \
          --no-build \
          --output ./console-app/
          
        # Test basic functionality
        ./console-app/SqliteXport.Console --help
        echo "✅ Console application help works"

  build-packages:
    name: Build NuGet Packages
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore DB2XL.sln
      
    - name: Generate version
      run: |
        if [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.ref }}" == "refs/heads/master" ]; then
          VERSION="1.0.${{ github.run_number }}"
        else
          VERSION="1.0.${{ github.run_number }}-preview"
        fi
        echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_ENV
        echo "Building version: $VERSION"
        
    - name: Build and pack libraries
      run: |
        # Pack main library
        dotnet pack SqliteXport/SqliteXport.csproj \
          --configuration ${{ env.BUILD_CONFIGURATION }} \
          --no-restore \
          --include-symbols \
          -p:PackageVersion=${{ env.PACKAGE_VERSION }} \
          --output ./packages/
          
        # Pack query library  
        dotnet pack DB2XL.Query/DB2XL.Query.csproj \
          --configuration ${{ env.BUILD_CONFIGURATION }} \
          --no-restore \
          --include-symbols \
          -p:PackageVersion=${{ env.PACKAGE_VERSION }} \
          --output ./packages/
          
        # Pack delta export library
        dotnet pack DB2XL.DeltaExport/DB2XL.DeltaExport.csproj \
          --configuration ${{ env.BUILD_CONFIGURATION }} \
          --no-restore \
          --include-symbols \
          -p:PackageVersion=${{ env.PACKAGE_VERSION }} \
          --output ./packages/
        
    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: packages/*.nupkg
        retention-days: 90

  build-console-executables:
    name: Build Console Executables
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 20
    strategy:
      matrix:
        runtime: [win-x64, linux-x64, osx-x64, osx-arm64]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore DB2XL.sln
      
    - name: Publish console application
      run: |
        dotnet publish SqliteXport.Console/SqliteXport.Console.csproj \
          --configuration ${{ env.BUILD_CONFIGURATION }} \
          --runtime ${{ matrix.runtime }} \
          --self-contained true \
          --output ./publish/${{ matrix.runtime }}/ \
          -p:PublishSingleFile=true \
          -p:PublishTrimmed=true \
          -p:TrimMode=link
          
    - name: Create archive
      run: |
        cd publish
        if [[ "${{ matrix.runtime }}" == win-* ]]; then
          zip -r "../sqlitexport-${{ matrix.runtime }}.zip" ${{ matrix.runtime }}/
        else
          tar -czf "../sqlitexport-${{ matrix.runtime }}.tar.gz" ${{ matrix.runtime }}/
        fi
        cd ..
        
    - name: Upload executables
      uses: actions/upload-artifact@v4
      with:
        name: console-${{ matrix.runtime }}
        path: sqlitexport-${{ matrix.runtime }}.*
        retention-days: 90

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan, performance-tests, integration-tests]
    if: always()
    timeout-minutes: 5
    
    steps:
    - name: Generate summary
      run: |
        echo "## 🔍 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Build and Test | ${{ needs.build-and-test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Scan | ${{ needs.security-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY  
        echo "| Performance Tests | ${{ needs.performance-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 All Projects Included" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ SqliteXport (Main Library)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ DB2XL.Query (Advanced Filtering & Performance)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ DB2XL.DeltaExport (Delta Export Functionality)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ SqliteXport.Console (CLI Tool)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ SqliteXport.Tests (Integration Tests)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ DB2XL.Query.Tests (Unit & Performance Tests)" >> $GITHUB_STEP_SUMMARY